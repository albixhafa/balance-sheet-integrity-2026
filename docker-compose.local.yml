# Local run: Postgres + the app at http://localhost:3000/balancesheet
#   cp .env.example .env
#   docker compose -f docker-compose.local.yml up -d --build
#   docker compose -f docker-compose.local.yml exec app sh -c 'ADMIN_EMAIL=you@example.com node scripts/create-admin.mjs'
services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bsi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-balance_sheet_db}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bsi}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-balance_sheet_db}
      # Plain HTTP on localhost; production (behind TLS) must leave this unset.
      COOKIE_SECURE: "false"
    # Applies the schema, then starts the server.
    command: ["sh", "-c", "npx prisma db push && npx next start -p 3000"]
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - attachments:/app/storage/attachments
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  attachments:
